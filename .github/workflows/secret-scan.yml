name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  personal-paths:
    name: personal-path-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block personal paths
        run: |
          set -e
          if grep -rEn "/Users/bioinfo|~/vaults/obsidian|justin\.johnson@astrazeneca" \
              --include="*.md" --include="*.py" --include="*.sh" \
              --include="*.toml" --include="*.yaml" --include="*.yml" \
              .; then
            echo "::error::Personal path or work email found in committed files"
            exit 1
          fi
          echo "OK: no personal paths detected"
